services:
  - type: web
    name: inventory-sales-supplier-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_ENV
        value: "prod"
      - key: SECRET_KEY
        value: 7ssgzad3r=pd5x#(f-^pcbw==+#4+5s_-!v7np1(39(kr)h(5=
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      - key: ALLOWED_HOSTS
        value: "websys2finalproject-group3.onrender.com"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        sync: true
      - key: DB_USER
        sync: true
      - key: DB_PASSWORD
        sync: true
      - key: DB_HOST
        sync: true
      - key: DB_PORT
        value: "5432"
