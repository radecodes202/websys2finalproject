databases:
  - name: websys2finalproject-db
    plan: free
    databaseName: inventory_db
    user: postgres

services:
  - type: web
    name: websys2finalproject
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application
    envVars:
      - key: DJANGO_ENV
        value: "prod"
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"
      - key: ALLOWED_HOSTS
        value: "websys2finalproject.onrender.com, .onrender.com"
      - key: DISABLE_AXES
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: websys2finalproject-db
          property: connectionString