{% extends 'base.html' %}

{% block title %}Delete Category{% endblock %}

{% block content %}
<div class="page-surface form-surface">
    <div class="page-header-row">
        <div>
            <div class="page-kicker">Catalog</div>
            <h1 class="page-title">Delete Category</h1>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class=\"card shadow-sm\">
                <div class=\"card-header bg-danger text-white\">
                    <h4 class=\"mb-0\">Delete Category</h4>
                </div>
                <div class=\"card-body\">
                    <p class="confirm-text">Are you sure you want to delete "{{ object.name }}"?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-actions">
                            <button type="submit" class="btn btn-danger">Yes, Delete</button>
                            <a href="{% url 'category:category-list' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
