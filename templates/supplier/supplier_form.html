{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}{% if object %}Edit Supplier{% else %}Add Supplier{% endif %}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>{% if object %}Edit Supplier{% else %}Add New Supplier{% endif %}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'supplier:supplier-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
