{% extends 'base.html' %}

{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="page-surface form-surface">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h4">Password reset email sent</h2>
            <p class="text-muted">If an account exists for that email, a reset link has been sent.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
