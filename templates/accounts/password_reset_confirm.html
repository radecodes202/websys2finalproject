{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="page-surface form-surface">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="h4">Set a new password</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100">Save new password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
